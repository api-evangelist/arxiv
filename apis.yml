name: arXiv
description: >-
  arXiv is the open-access e-print repository operated by Cornell Tech, hosting more than two million preprints across
  physics, mathematics, computer science, quantitative biology, quantitative finance, statistics, electrical
  engineering, and economics. arXiv exposes two principal programmatic interfaces: a REST Query API that returns Atom
  1.0 XML and an OAI-PMH v2.0 endpoint for bulk metadata harvesting, plus daily RSS feeds and Amazon S3 / Kaggle
  distributions for full-text corpora.
