apiVersion: naftiko.dev/v1alpha1
kind: Capability
metadata:
  name: arxiv-oaipmh
  description: Shared capability surface for the arXiv OAI-PMH bulk metadata harvest API.
  labels:
    provider: arxiv
    domain: scholarly-publishing
spec:
  source:
    openapi: ../openapi/arxiv-oaipmh-openapi.yml
  operations:
    - id: oaiVerb
      summary: Invoke An Oai-pmh Verb
      access: read
      sensitivity: public
  policy:
    rateLimit:
      requestsPerSecond: 0.33
      burst: 1
      note: |
        Shared three-second rate limit across arXiv legacy APIs. Honour
        resumptionToken sequences for large list responses; harvest windows
        ideally align with daily metadata refresh (~10:30pm ET, Sun-Thu).
    attribution:
      required: true
      text: "Thank you to arXiv for use of its open access interoperability."
